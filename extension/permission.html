<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Microphone access · YouTube AI Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="page">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
    </div>
    <div class="titles">
      <h1>Enable voice input</h1>
      <p class="subtitle">Chrome can't ask for microphone access inside the extension popup</p>
    </div>
  </header>

  <div id="status" class="status loading">Waiting for microphone permission…</div>
  <p id="message">Click <b>Allow</b> in Chrome's prompt. Your audio is only used for speech-to-text while the mic button is on.</p>
  <button id="retry" class="speak" type="button" hidden>Try again</button>

  <script src="permission.js"></script>
</body>
</html>
